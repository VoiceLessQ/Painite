[workspace]
resolver = "3"
members = [
  "rust/sched",
  "rust/mod",
  "rust/terrain",
]

# Same profile Ferrite measured: fat LTO + one codegen unit halves the
# native, debuginfo stripped but symbols kept for crash reports, no
# panic=abort: every JNI entry point catches a panic and declines, which
# needs unwinding, instead of taking the JVM down.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
